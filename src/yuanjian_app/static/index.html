<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远见 · 个人利益预知</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span>远见</span><small>个人利益预知</small></div>
      <nav aria-label="主要功能">
        <button class="nav primary-nav active" type="button" data-view="today"><span class="nav-icon">做</span><span>行动首页</span></button>
        <button class="nav primary-nav" type="button" data-view="input"><span class="nav-icon">说</span><span>告诉远见</span></button>
        <button class="nav primary-nav" type="button" data-view="system"><span class="nav-icon">设</span><span>设置</span></button>
      </nav>
      <div class="sidebar-foot">
        <div id="connection" class="monitor-status"><span class="status-dot"></span><span>后台监控 · 正在连接</span></div>
        <button id="shutdown" class="button button-quiet" type="button">安全退出</button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div><h1 id="page-title">现在该做什么</h1><p id="page-caption">直接看建议；需要时再看原因</p></div>
        <div class="header-actions"><button id="open-notifications" class="button" type="button">提醒 <span id="header-unread">0</span></button><button id="run-cognition" class="button button-primary" type="button">立即更新判断</button></div>
      </header>
      <section id="content" aria-live="polite">
        <div class="loading-block"><span class="spinner"></span>正在整理你需要知道的风险…</div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/cognition_ui.js"></script>
  <script src="/ui_core.js"></script>
  <script src="/risk_ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
